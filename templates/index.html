<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jiosaavn-dl — Download Music from JioSaavn</title>
    <meta name="description" content="Download songs, albums, and playlists from JioSaavn in high quality 320kbps AAC with full metadata and lyrics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --bg-input: rgba(255, 255, 255, 0.06);
            --bg-input-focus: rgba(255, 255, 255, 0.09);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(139, 92, 246, 0.5);
            --text-primary: #f0f0f5;
            --text-secondary: #8a8a9a;
            --text-muted: #55556a;
            --accent-start: #8b5cf6;
            --accent-end: #06b6d4;
            --accent-hover-start: #7c3aed;
            --accent-hover-end: #0891b2;
            --error-bg: rgba(239, 68, 68, 0.1);
            --error-border: rgba(239, 68, 68, 0.3);
            --error-text: #fca5a5;
            --success-bg: rgba(34, 197, 94, 0.1);
            --success-border: rgba(34, 197, 94, 0.3);
            --success-text: #86efac;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }

        .orb--1 {
            width: 500px;
            height: 500px;
            background: var(--accent-start);
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb--2 {
            width: 400px;
            height: 400px;
            background: var(--accent-end);
            bottom: -15%;
            right: -10%;
            animation-delay: -7s;
        }

        .orb--3 {
            width: 300px;
            height: 300px;
            background: #ec4899;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(40px, 30px) scale(1.03); }
        }

        .container {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease;
        }

        .card:hover {
            background: var(--bg-card-hover);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: color 0.2s ease;
            pointer-events: none;
        }

        .url-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .url-input::placeholder {
            color: var(--text-muted);
        }

        .url-input:focus {
            background: var(--bg-input-focus);
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .url-input:focus ~ .input-icon {
            color: var(--accent-start);
        }

        /* Options */
        .options {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .option input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1.5px solid var(--border-subtle);
            background: var(--bg-input);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .option input[type="checkbox"]:checked {
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            border-color: transparent;
        }

        .option input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 11px;
            font-weight: 700;
        }

        .option span {
            font-size: 13px;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }

        .option:hover span {
            color: var(--text-primary);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.2px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-hover-start), var(--accent-hover-end));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .submit-btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.35);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Messages */
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.5;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .message.show {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .message--error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        .message--success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .message-icon {
            flex-shrink: 0;
            margin-top: 1px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--accent-start);
        }

        /* Supported formats hint */
        .formats {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .format-badge {
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
                border-radius: var(--radius-lg);
            }

            .options {
                flex-direction: column;
                gap: 12px;
            }

            .orb--1 { width: 300px; height: 300px; }
            .orb--2 { width: 250px; height: 250px; }
            .orb--3 { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>
    <!-- Animated background orbs -->
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">♪</div>
                <span class="logo-text">jiosaavn-dl</span>
            </div>
            <p class="subtitle">Download songs, albums & playlists from JioSaavn<br>in 320kbps AAC with full metadata & lyrics</p>
        </header>

        <div class="card">
            <form id="downloadForm">
                <div class="form-group">
                    <label class="form-label" for="urlInput">JioSaavn URL</label>
                    <div class="input-wrapper">
                        <input
                            type="url"
                            id="urlInput"
                            class="url-input"
                            placeholder="https://www.jiosaavn.com/song/..."
                            required
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <span class="input-icon">🔗</span>
                    </div>
                </div>

                <div class="options">
                    <label class="option">
                        <input type="checkbox" id="addNumbers">
                        <span>Track numbers</span>
                    </label>
                    <label class="option">
                        <input type="checkbox" id="downloadCover">
                        <span>Include cover art file</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-content">
                        <span class="spinner"></span>
                        <span id="btnText">Download</span>
                    </span>
                </button>
            </form>

            <div class="message message--error" id="errorMsg">
                <span class="message-icon">⚠</span>
                <span id="errorText"></span>
            </div>
            <div class="message message--success" id="successMsg">
                <span class="message-icon">✓</span>
                <span id="successText"></span>
            </div>
        </div>

        <div class="footer">
            <div class="formats">
                <span class="format-badge">🎵 Songs</span>
                <span class="format-badge">💿 Albums</span>
                <span class="format-badge">📋 Playlists</span>
            </div>
            <p style="margin-top: 12px;">
                Made by <a href="https://github.com/bunnykek" target="_blank">bunnykek</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successMsg = document.getElementById('successMsg');
        const successText = document.getElementById('successText');

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
        }

        function showSuccess(msg) {
            successText.textContent = msg;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        function hideMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            urlInput.disabled = isLoading;
            if (isLoading) {
                submitBtn.classList.add('loading');
                btnText.textContent = 'Downloading...';
            } else {
                submitBtn.classList.remove('loading');
                btnText.textContent = 'Download';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const url = urlInput.value.trim();
            if (!url) {
                showError('Please enter a URL.');
                return;
            }

            // Basic client-side validation
            if (!url.includes('jiosaavn.com')) {
                showError('Please enter a valid JioSaavn URL.');
                return;
            }

            setLoading(true);

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        addNumbers: document.getElementById('addNumbers').checked,
                        downloadCover: document.getElementById('downloadCover').checked,
                    }),
                });

                if (!response.ok) {
                    const data = await response.json();
                    showError(data.error || 'An unexpected error occurred.');
                    return;
                }

                // Get filename from Content-Disposition header
                const disposition = response.headers.get('Content-Disposition');
                let filename = 'jiosaavn-dl.zip';
                if (disposition) {
                    const match = disposition.match(/filename\*?=(?:UTF-8''|")?(.*?)(?:"|;|$)/i);
                    if (match) {
                        filename = decodeURIComponent(match[1]);
                    }
                }

                // Download the file
                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(downloadUrl);

                const type = response.headers.get('Content-Type');
                if (type && type.includes('audio')) {
                    showSuccess(`Track downloaded successfully!`);
                } else {
                    showSuccess(`Download complete! Check your downloads folder.`);
                }

            } catch (err) {
                showError('Network error. Please try again.');
                console.error(err);
            } finally {
                setLoading(false);
            }
        });

        // Clear messages on new input
        urlInput.addEventListener('input', hideMessages);
    </script>
</body>
</html>
